name: Validate Secrets

on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-se1' }}

jobs:
  validate:
    name: Validate Secrets and Environment
    runs-on: ubuntu-latest

    steps:
      - name: Check Required Secrets Exist
        run: |
          echo "## Secret Validation 🔍" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          ERRORS=0

          # Check GCP_SA_KEY
          if [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "✅ GCP_SA_KEY is set" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ GCP_SA_KEY is missing" >> $GITHUB_STEP_SUMMARY
            ERRORS=$((ERRORS + 1))
          fi

          # Check GCP_PROJECT_ID
          if [ -n "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "✅ GCP_PROJECT_ID is set: \`${{ secrets.GCP_PROJECT_ID }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ GCP_PROJECT_ID is missing" >> $GITHUB_STEP_SUMMARY
            ERRORS=$((ERRORS + 1))
          fi

          # Check TELEGRAM_BOT_TOKEN
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
            echo "✅ TELEGRAM_BOT_TOKEN is set (length: ${#TOKEN})" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ TELEGRAM_BOT_TOKEN is missing" >> $GITHUB_STEP_SUMMARY
            ERRORS=$((ERRORS + 1))
          fi

          # Check JWT_SECRET
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            SECRET="${{ secrets.JWT_SECRET }}"
            echo "✅ JWT_SECRET is set (length: ${#SECRET})" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ JWT_SECRET is missing" >> $GITHUB_STEP_SUMMARY
            ERRORS=$((ERRORS + 1))
          fi

          # Check FIREBASE_PROJECT_ID
          if [ -n "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "✅ FIREBASE_PROJECT_ID is set: \`${{ secrets.FIREBASE_PROJECT_ID }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ FIREBASE_PROJECT_ID is missing" >> $GITHUB_STEP_SUMMARY
            ERRORS=$((ERRORS + 1))
          fi

          # Check FIREBASE_CLIENT_EMAIL
          if [ -n "${{ secrets.FIREBASE_CLIENT_EMAIL }}" ]; then
            echo "✅ FIREBASE_CLIENT_EMAIL is set: \`${{ secrets.FIREBASE_CLIENT_EMAIL }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ FIREBASE_CLIENT_EMAIL is missing" >> $GITHUB_STEP_SUMMARY
            ERRORS=$((ERRORS + 1))
          fi

          # Check FIREBASE_PRIVATE_KEY
          # Use env variable instead of direct substitution to avoid shell escaping issues
          echo "FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}" > /tmp/test_key.txt

          if [ -s /tmp/test_key.txt ] && grep -q "=" /tmp/test_key.txt; then
            KEY=$(cat /tmp/test_key.txt | cut -d'=' -f2-)
            echo "✅ FIREBASE_PRIVATE_KEY is set (length: ${#KEY})" >> $GITHUB_STEP_SUMMARY

            # Validate key format
            if echo "$KEY" | grep -q "BEGIN PRIVATE KEY"; then
              echo "  ✅ Contains BEGIN PRIVATE KEY marker" >> $GITHUB_STEP_SUMMARY
            else
              echo "  ❌ Missing BEGIN PRIVATE KEY marker" >> $GITHUB_STEP_SUMMARY
              ERRORS=$((ERRORS + 1))
            fi

            if echo "$KEY" | grep -q "END PRIVATE KEY"; then
              echo "  ✅ Contains END PRIVATE KEY marker" >> $GITHUB_STEP_SUMMARY
            else
              echo "  ❌ Missing END PRIVATE KEY marker" >> $GITHUB_STEP_SUMMARY
              ERRORS=$((ERRORS + 1))
            fi

            # Check for literal \n vs actual newlines
            if echo "$KEY" | grep -q '\\n'; then
              echo "  ⚠️ Contains literal \\\\n characters (should be actual newlines for GitHub Secrets)" >> $GITHUB_STEP_SUMMARY
              echo "  💡 Tip: Paste the key with actual newlines, not escaped \\\\n" >> $GITHUB_STEP_SUMMARY
            else
              echo "  ✅ No literal \\\\n found (good - using actual newlines)" >> $GITHUB_STEP_SUMMARY
            fi

          else
            echo "❌ FIREBASE_PRIVATE_KEY is missing" >> $GITHUB_STEP_SUMMARY
            ERRORS=$((ERRORS + 1))
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $ERRORS -eq 0 ]; then
            echo "### ✅ All secrets are valid!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Found $ERRORS error(s)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Check Variables
        run: |
          echo "## Variable Validation 📋" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check GCP_REGION
          if [ -n "${{ vars.GCP_REGION }}" ]; then
            echo "✅ GCP_REGION is set: \`${{ vars.GCP_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ GCP_REGION not set, using default: \`asia-se1\`" >> $GITHUB_STEP_SUMMARY
          fi

          # Check SERVICE_NAME
          if [ -n "${{ vars.SERVICE_NAME }}" ]; then
            echo "✅ SERVICE_NAME is set: \`${{ vars.SERVICE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ SERVICE_NAME not set, using default: \`telegram-webapp-google-tpl\`" >> $GITHUB_STEP_SUMMARY
          fi

          # Check WEB_APP_URL
          if [ -n "${{ vars.WEB_APP_URL }}" ]; then
            echo "✅ WEB_APP_URL is set: \`${{ vars.WEB_APP_URL }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ WEB_APP_URL not set (webhook won't be configured)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP Authentication
        run: |
          echo "## GCP Authentication Test 🔐" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get current account
          ACCOUNT=$(gcloud config get-value account)
          echo "✅ Authenticated as: \`$ACCOUNT\`" >> $GITHUB_STEP_SUMMARY

          # Get current project
          PROJECT=$(gcloud config get-value project)
          echo "✅ Project: \`$PROJECT\`" >> $GITHUB_STEP_SUMMARY

          # Verify project matches secret
          if [ "$PROJECT" = "${{ env.GCP_PROJECT_ID }}" ]; then
            echo "✅ Project ID matches GCP_PROJECT_ID secret" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Project ID mismatch!" >> $GITHUB_STEP_SUMMARY
            echo "  - Authenticated: \`$PROJECT\`" >> $GITHUB_STEP_SUMMARY
            echo "  - Secret: \`${{ env.GCP_PROJECT_ID }}\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Test Firestore Database Access
        run: |
          echo "## Firestore Database Test 🔥" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List databases
          DATABASES=$(gcloud firestore databases list --project=${{ secrets.FIREBASE_PROJECT_ID }} --format=json 2>&1)

          if echo "$DATABASES" | grep -q "name"; then
            echo "✅ Firestore database exists in project \`${{ secrets.FIREBASE_PROJECT_ID }}\`" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            echo "$DATABASES" | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No Firestore databases found or permission denied" >> $GITHUB_STEP_SUMMARY
            echo "Error: $DATABASES" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Test Environment Variables YAML Format
        run: |
          echo "## Environment Variables YAML Test 🧪" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Create the same env.yaml file that deploy.yml will create
          cat > env.yaml << 'EOF'
          NODE_ENV: production
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: |
            ${{ secrets.FIREBASE_PRIVATE_KEY }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          EOF

          # Check if file was created successfully
          if [ -f env.yaml ]; then
            echo "✅ env.yaml file created" >> $GITHUB_STEP_SUMMARY

            # Count keys (should be 7)
            KEY_COUNT=$(grep -c '^[A-Z_]*:' env.yaml || true)
            echo "✅ Found $KEY_COUNT environment variables" >> $GITHUB_STEP_SUMMARY

            # Show file size
            FILE_SIZE=$(wc -c < env.yaml)
            echo "✅ File size: $FILE_SIZE bytes" >> $GITHUB_STEP_SUMMARY

            # Validate it's valid YAML (try to parse with Python)
            if command -v python3 &> /dev/null; then
              if python3 -c "import yaml; yaml.safe_load(open('env.yaml'))" 2>/dev/null; then
                echo "✅ Valid YAML format" >> $GITHUB_STEP_SUMMARY
              else
                echo "❌ Invalid YAML format" >> $GITHUB_STEP_SUMMARY
                echo '```yaml' >> $GITHUB_STEP_SUMMARY
                cat env.yaml >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                exit 1
              fi
            fi

            # Show first few lines (redacted)
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**env.yaml preview (first 10 lines):**" >> $GITHUB_STEP_SUMMARY
            echo '```yaml' >> $GITHUB_STEP_SUMMARY
            head -10 env.yaml | sed 's/\(BOT_TOKEN:\).*/\1 ***/; s/\(JWT_SECRET:\).*/\1 ***/' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Failed to create env.yaml" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Dry Run - Validate with gcloud
        run: |
          echo "## gcloud Dry Run Test 🏃" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Try to validate the env.yaml file with gcloud (without actually deploying)
          # This will catch any formatting issues before actual deployment

          SERVICE_NAME="${{ vars.SERVICE_NAME || 'telegram-webapp-google-tpl' }}"
          REGION="${{ vars.GCP_REGION || 'asia-southeast1' }}"

          # Create a minimal test - just validate the env vars file can be parsed
          # Note: We can't do a full dry-run without an image, but we can test the YAML

          echo "✅ Service name: \`$SERVICE_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ Region: \`$REGION\`" >> $GITHUB_STEP_SUMMARY

          # Validate that gcloud can read the env.yaml file
          if gcloud run services describe $SERVICE_NAME --region=$REGION --format=json &> /dev/null; then
            echo "✅ Service exists in Cloud Run" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "💡 To test env.yaml deployment without full build:" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "gcloud run services update $SERVICE_NAME \\" >> $GITHUB_STEP_SUMMARY
            echo "  --region=$REGION \\" >> $GITHUB_STEP_SUMMARY
            echo "  --env-vars-file=env.yaml" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Service does not exist yet (will be created on first deploy)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Final Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📝 How to Fix Issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If FIREBASE_PRIVATE_KEY has issues:" >> $GITHUB_STEP_SUMMARY
          echo "1. Copy the entire private key from your service account JSON" >> $GITHUB_STEP_SUMMARY
          echo "2. Paste it into GitHub Secrets with actual newlines (not \\\\n)" >> $GITHUB_STEP_SUMMARY
          echo "3. The key should look like:" >> $GITHUB_STEP_SUMMARY
          echo '   ```' >> $GITHUB_STEP_SUMMARY
          echo '   -----BEGIN PRIVATE KEY-----' >> $GITHUB_STEP_SUMMARY
          echo '   MIIEvwIBADANBgkqhkiG9w0...' >> $GITHUB_STEP_SUMMARY
          echo '   ...' >> $GITHUB_STEP_SUMMARY
          echo '   -----END PRIVATE KEY-----' >> $GITHUB_STEP_SUMMARY
          echo '   ```' >> $GITHUB_STEP_SUMMARY
