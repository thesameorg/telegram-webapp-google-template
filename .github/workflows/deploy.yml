name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME }}

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          [ -n "${{ secrets.GCP_SA_KEY }}" ] || { echo "Missing GCP_SA_KEY"; exit 1; }
          [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || { echo "Missing TELEGRAM_BOT_TOKEN"; exit 1; }
          [ -n "${{ secrets.JWT_SECRET }}" ] || { echo "Missing JWT_SECRET"; exit 1; }
          [ -n "${{ secrets.FIREBASE_PROJECT_ID }}" ] || { echo "Missing FIREBASE_PROJECT_ID"; exit 1; }
          [ -n "${{ secrets.FIREBASE_CLIENT_EMAIL }}" ] || { echo "Missing FIREBASE_CLIENT_EMAIL"; exit 1; }
          [ -n "${{ secrets.FIREBASE_PRIVATE_KEY }}" ] || { echo "Missing FIREBASE_PRIVATE_KEY"; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}
          docker build --platform linux/amd64 -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Create environment variables file
        run: |
          cat > env.yaml << EOF
          NODE_ENV: production
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: |
          $(echo "${{ secrets.FIREBASE_PRIVATE_KEY }}" | sed 's/^/  /')
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --env-vars-file=env.yaml \
            --min-instances=0 \
            --max-instances=10 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=300 \
            --port=8080

      - name: Get Cloud Run URL
        id: get-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Set Telegram Webhook
        if: ${{ vars.WEB_APP_URL != '' }}
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            -H "Content-Type: application/json" \
            -d '{"url": "${{ steps.get-url.outputs.url }}/webhook", "allowed_updates": ["message"], "drop_pending_updates": true}' | grep -q '"ok":true'

      - name: Verify Deployment
        run: sleep 10 && curl -sf "${{ steps.get-url.outputs.url }}/health" | grep -q '"status":"ok"'
